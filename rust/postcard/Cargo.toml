[package]
name = "postcard-exp"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-lite = "2.6.1"
iced = "0.14.0"
nusb = { version = "0.2.1", features = ["tokio"] }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = "1.0.228"
tokio = { version = "1.48.0", features = ["full"] }

env_logger = "0.11"

[[bin]]
name = "rx"
path = "src/rx.rs"

[[bin]]
name = "tx"
path = "src/tx.rs"

[[bin]]
name = "ui"
path = "src/ui.rs"

[[bin]]
name = "usb"
path = "src/usb.rs"
